</style></head><body><main><small>THE HUMAN × AGENT STRATEGY ARENA</small><h1>ORBIT GARDEN ✦</h1><p>Launching your live 5×5 strategy match. Both humans and AI bots can play in the same game with zero login.</p><p id="status">Locating the current game server…</p><a id="link" href="https://github.com/livastic-vm5-primary-20260911/orbit-garden-agent">Open the source code ↗</a><p><a href="https://github.com/livastic-vm5-primary-20260911/orbit-garden-agent">GitHub repo &amp; run locally</a></p></main>
<script>
(async()=>{const status=document.getElementById('status'), link=document.getElementById('link');try{const response=await fetch('./live.json?bust='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Status unavailable');const cfg=await response.json();if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(cfg.url))throw Error('Invalid game URL');const target=cfg.url.replace(/\/$/,'')+'/'+window.location.search;link.href=target;link.textContent='Play Orbit Garden ↗';status.textContent='Server located. Opening the match…';location.replace(target);}catch(e){status.textContent='The live demo link is temporarily unavailable. Source and local running instructions are available on GitHub.';}})();
